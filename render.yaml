services:
  # 1. User Service (Node.js)
  - type: web
    name: user-service
    env: node
    rootDir: backend/services/user-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: acadconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  # 2. Project Service (Node.js)
  - type: web
    name: project-service
    env: node
    rootDir: backend/services/project-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase:
          name: acadconnect-db
          property: connectionString
      - key: MONGO_URI
        sync: false # User must provide MongoDB Atlas URI
      - key: JWT_SECRET
        fromService:
          name: user-service
          type: web
          envVarKey: JWT_SECRET
      - key: AI_FEEDBACK_SERVICE_URL
        fromService:
          name: ai-feedback-service
          type: web
          property: host

  # 3. AI Feedback Service (Python)
  - type: web
    name: ai-feedback-service
    env: python
    rootDir: backend/services/ai-feedback-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8001
    envVars:
      - key: PORT
        value: 8001
      - key: MONGO_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # 4. Recommendation Service (Python)
  - type: web
    name: recommendation-service
    env: python
    rootDir: backend/services/recommendation-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8002
    envVars:
      - key: PORT
        value: 8002
      - key: MONGO_URI
        sync: false

databases:
  - name: acadconnect-db
    databaseName: acadconnect
    user: acadconnect
    plan: free
